<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Cancer Detection</title>
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="display-4 text-center mb-4">Cancer Detection</h1>
        <form action="/predict" method="post" enctype="multipart/form-data" id="upload-form">
            <div class="mb-3">
                <label for="file" class="form-label">Choose Images</label>
                <input type="file" class="form-control" id="file" name="file" accept="image/*" multiple required>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>
        <div id="results" class="mt-4">
            {% if error %}
                <div class="alert alert-danger my-2" role="alert">
                    {{ error }}
                </div>
            {% elif results %}
                {% for result in results %}
                    <div class="alert {% if result.result == 1 %}alert-success{% else %}alert-danger{% endif %} my-2" role="alert">
                        {{ result.filename }} - {% if result.result == 1 %}Positive{% else %}Negative{% endif %}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
        <a href="/live" class="btn btn-primary mt-4">Live Detection</a>
    </div>
    <!-- Bootstrap JS and Popper.js (optional, for Bootstrap's JavaScript features) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
